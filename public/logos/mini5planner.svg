<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <!-- Grid mission pattern (lawnmower) -->
  <g stroke="#FF6B1A" stroke-width="14" fill="none" opacity="0.85" stroke-linecap="round">
    <!-- Horizontal lines representing flight passes -->
    <path d="M 230 740 L 794 740"/>
    <path d="M 230 620 L 794 620"/>
    <path d="M 230 500 L 794 500"/>
    <!-- Connecting turn arcs on right side -->
    <path d="M 794 740 Q 854 740 854 680 Q 854 620 794 620"/>
    <path d="M 794 500 Q 854 500 854 560 Q 854 620 794 620" opacity="0"/>
    <!-- Connecting turn arcs on left side -->
    <path d="M 230 620 Q 170 620 170 560 Q 170 500 230 500"/>
    <!-- Dashed continuation up -->
    <path d="M 230 500 L 230 400" stroke-dasharray="20 24"/>
    <path d="M 794 740 L 794 850" stroke-dasharray="20 24" opacity="0"/>
  </g>
  <!-- Drone (quadcopter) above grid -->
  <g transform="translate(512 340)">
    <!-- 4 propeller circles -->
    <circle cx="-140" cy="-140" r="68" fill="url(#accent)" opacity="0.95"/>
    <circle cx="140" cy="-140" r="68" fill="url(#accent)" opacity="0.95"/>
    <circle cx="-140" cy="140" r="68" fill="url(#accent)" opacity="0.95"/>
    <circle cx="140" cy="140" r="68" fill="url(#accent)" opacity="0.95"/>
    <!-- Arms (X shape) -->
    <line x1="-100" y1="-100" x2="100" y2="100" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    <line x1="100" y1="-100" x2="-100" y2="100" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    <!-- Body -->
    <circle cx="0" cy="0" r="60" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="30" fill="#1a1d23"/>
  </g>
</svg>
